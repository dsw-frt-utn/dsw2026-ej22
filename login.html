<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login_style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="login-card">
      <!-- Reemplazar con etiqueta <img> cuando tengas el logo -->
      <h2 style="text-align: center; margin-bottom: 2rem">🛡️ MedPortal</h2>

      <p
        style="
          font-size: 0.85rem;
          color: var(--text-secondary);
          margin-bottom: 1.5rem;
        "
      >
        Bienvenido de nuevo<br />Por favor, autentíquese para acceder al portal
        de proveedores.
      </p>

      <form id="login-form">
        <label for="username">Nombre de usuario</label>
        <div class="input-group">
          <i class="fa-solid fa-user input-icon"></i>
          <input
            type="text"
            id="username"
            placeholder="Ingrese ID de admin"
            required
          />
        </div>

        <label for="password">Contraseña</label>
        <div class="input-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            type="password"
            id="password"
            placeholder="********"
            required
          />
        </div>

        <button type="submit" class="btn-primary">
          Iniciar Sesión <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
      </form>

      <div class="security-notice">
        <strong>🛡️ Solo Acceso Seguro:</strong> Este sistema es para personal
        médico autorizado.
      </div>
    </div>
    <script src="js/login.js"></script>
  </body>
</html>
